<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>색칠놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FFE8D6;
    --sky-bottom:#FFF6DF;
    --ink:#2B2140;
    --card-bg:#FFFFFF;
    --coral:#FF6F59;
    --leaf:#4CB963;
    --skyblue:#3AA6FF;
    --grape:#A66CFF;
    --lemon:#FFC93F;
    --shadow: 0 8px 0 rgba(43,33,64,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    min-height:100vh;
    font-family:'Gowun Dodum', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 14px 24px;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }

  /* 뒤로가기 - 떠있는 작은 버튼 (문서 흐름에서 빠져있어 화면을 줄이지 않음) */
  .back-fab{
    position:fixed; top:12px; left:12px; z-index:30;
    width:42px; height:42px; border-radius:50%;
    background:#fff; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; text-decoration:none; color:var(--ink);
  }

  header{ text-align:center; margin:2px 0 10px; }
  h1{
    font-family:'Jua', sans-serif;
    font-size:clamp(20px, 6vw, 26px);
    margin:0;
  }

  /* 카테고리 큰 버튼 4개 */
  .category-row{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
    width:min(420px, 96vw); margin-bottom:10px;
  }
  .cat-btn{
    background:#fff; border:3px solid transparent; border-radius:16px;
    box-shadow:var(--shadow); padding:8px 4px 6px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    cursor:pointer;
  }
  .cat-btn.active{ border-color:var(--coral); }
  .cat-btn .cat-icon{ font-size:24px; }
  .cat-btn .cat-name{ font-family:'Jua', sans-serif; font-size:10.5px; }
  .cat-btn .cur-item{ font-size:9.5px; opacity:.6; }

  .canvas-wrap{
    position:relative;
    width:min(440px, 96vw);
    height:min(440px, 96vw);
    background:#fff;
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
    touch-action:none;
  }
  #paintCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none;
  }
  #outlineSvg{
    position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
  }

  .toolbar{
    width:min(440px, 96vw);
    margin-top:12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .palette{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    background:#fff; border-radius:18px; padding:10px; box-shadow:var(--shadow);
  }
  .swatch{
    width:28px; height:28px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(43,33,64,0.15); cursor:pointer; flex-shrink:0;
  }
  .swatch.active{ box-shadow:0 0 0 3px var(--ink); transform:scale(1.1); }

  .row{ display:flex; gap:8px; justify-content:center; }
  .btn{
    flex:1;
    font-family:'Jua', sans-serif;
    font-size:12.5px;
    color:var(--ink);
    background:#fff;
    border:none;
    border-radius:14px;
    padding:11px 8px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(43,33,64,0.12); }
  .btn.active{ background:var(--lemon); }
  .btn.danger{ color:#fff; background:var(--coral); }

  /* 그림 고르기 모달 */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,33,64,0.45);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-sheet{
    width:100%; max-width:420px; background:var(--card-bg);
    border-radius:28px 28px 0 0; padding:20px 18px 28px;
    box-shadow:0 -8px 24px rgba(0,0,0,0.2);
  }
  .modal-title{
    font-family:'Jua', sans-serif; font-size:18px; text-align:center; margin:0 0 16px;
  }
  .item-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
  }
  .item-btn{
    background:var(--sky-bottom); border:3px solid transparent; border-radius:20px;
    padding:14px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
  }
  .item-btn.active{ border-color:var(--coral); background:#fff; }
  .item-btn .item-icon{ font-size:40px; }
  .item-btn .item-name{ font-family:'Jua', sans-serif; font-size:12px; }
  .modal-close{
    display:block; margin:18px auto 0;
    font-family:'Jua', sans-serif; font-size:14px; color:var(--ink);
    background:#F0EEF6; border:none; border-radius:14px; padding:10px 24px; cursor:pointer;
  }
</style>
</head>
<body>
  <a class="back-fab" href="../index.html">←</a>

    <h1>🎨 색칠놀이</h1>
  </header>

  </div>

  <div class="toolbar">
    <div class="palette" id="palette"></div>
    <div class="row">
      <button class="btn" data-size="10">● 얇게</button>
      <button class="btn active" data-size="20">● 보통</button>
      <button class="btn" data-size="34">● 굵게</button>
    </div>
    <div class="row">
      <button class="btn" id="eraserBtn">🧹 지우개</button>
      <button class="btn danger" id="clearBtn">🔄 다시 칠하기</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <h2 class="modal-title" id="modalTitle">그림을 골라보세요</h2>
      <div class="item-grid" id="itemGrid"></div>
      <button class="modal-close" id="modalClose">닫기</button>
    </div>
  </div>

        <circle cx="168" cy="118" r="9" fill="#2B2140"/>
        <circle cx="150" cy="160" r="9" fill="#2B2140"/>
      `}
    }
  }
};

const COLORS = ['#FF6F59','#FFC93F','#4CB963','#3AA6FF','#A66CFF','#FF8FB3','#8D6E63','#2B2140','#FFFFFF'];

/* ===================== 상태 ===================== */
let currentCategory = 'animals';
let currentItem = 'bear';
let currentColor = COLORS[0];
let brushSize = 20;
let isEraser = false;
let drawing = false;
let lastX = 0, lastY = 0;

const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const outlineSvg = document.getElementById('outlineSvg');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const itemGrid = document.getElementById('itemGrid');

/* ===================== 캔버스 크기 세팅 ===================== */
function setupCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function clearCanvas(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ===================== 카테고리 큰 버튼 4개 ===================== */
const categoryRowEl = document.getElementById('categoryRow');
Object.keys(CATEGORIES).forEach(catKey => {
  const cat = CATEGORIES[catKey];
  const btn = document.createElement('div');
  btn.className = 'cat-btn' + (catKey === currentCategory ? ' active' : '');
  btn.dataset.cat = catKey;
  btn.innerHTML = `<div class="cat-icon">${cat.icon}</div><div class="cat-name">${cat.name}</div><div class="cur-item" data-curitem></div>`;
  btn.onclick = () => openPicker(catKey);
  categoryRowEl.appendChild(btn);
});

function updateCategoryButtons(){
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const key = btn.dataset.cat;
    btn.classList.toggle('active', key === currentCategory);
    const curItemEl = btn.querySelector('[data-curitem]');
    curItemEl.textContent = (key === currentCategory) ? CATEGORIES[key].items[currentItem].name : '';
  });
}

/* ===================== 그림 고르기 모달 ===================== */
function openPicker(catKey){
  modalTitle.textContent = `${CATEGORIES[catKey].icon} ${CATEGORIES[catKey].name} 고르기`;
  itemGrid.innerHTML = '';
  Object.keys(CATEGORIES[catKey].items).forEach(itemKey => {
    const item = CATEGORIES[catKey].items[itemKey];
    const isActive = (catKey === currentCategory && itemKey === currentItem);
    const btn = document.createElement('div');
    btn.className = 'item-btn' + (isActive ? ' active' : '');
    btn.innerHTML = `<div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>`;
    btn.onclick = () => { selectItem(catKey, itemKey); closePicker(); };
    itemGrid.appendChild(btn);
  });
  modalBackdrop.classList.add('show');
}
function closePicker(){ modalBackdrop.classList.remove('show'); }
document.getElementById('modalClose').onclick = closePicker;
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closePicker(); });

function selectItem(catKey, itemKey){
  currentCategory = catKey;
  currentItem = itemKey;
  outlineSvg.innerHTML = CATEGORIES[catKey].items[itemKey].svg;
  clearCanvas();
  updateCategoryButtons();
}

/* ===================== 색상 팔레트 ===================== */
const paletteEl = document.getElementById('palette');
COLORS.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch' + (i === 0 ? ' active' : '');
  sw.style.background = c;
  if (c === '#FFFFFF') sw.style.boxShadow = '0 0 0 2px rgba(43,33,64,0.3)';
  sw.onclick = () => {
    currentColor = c;
    isEraser = false;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    document.getElementById('eraserBtn').classList.remove('active');
  };
  paletteEl.appendChild(sw);
});

/* ===================== 브러시 크기 ===================== */
document.querySelectorAll('[data-size]').forEach(btn => {
  btn.onclick = () => {
    brushSize = Number(btn.dataset.size);
    document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

/* ===================== 지우개 / 다시 칠하기 ===================== */
document.getElementById('eraserBtn').onclick = (e) => {
  isEraser = !isEraser;
  e.currentTarget.classList.toggle('active', isEraser);
};
document.getElementById('clearBtn').onclick = clearCanvas;

/* ===================== 그리기 ===================== */
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}
function startDraw(e){
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  drawDot(p.x, p.y);
}
function moveDraw(e){
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  drawLine(lastX, lastY, p.x, p.y);
  lastX = p.x; lastY = p.y;
}
function endDraw(){ drawing = false; }

function drawDot(x, y){
  ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
  ctx.fillStyle = currentColor;
  ctx.beginPath();
  ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
  ctx.fill();
}
function drawLine(x0, y0, x1, y1){
  ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = brushSize;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive:false });
canvas.addEventListener('touchmove', moveDraw, { passive:false });
canvas.addEventListener('touchend', endDraw);

/* ===================== 초기화 ===================== */
window.addEventListener('resize', () => { setupCanvas(); });
setupCanvas();
selectItem('animals', 'bear');
</script>
</body>
</html>
